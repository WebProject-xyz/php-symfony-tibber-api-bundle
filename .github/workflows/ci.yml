on:
  push:
    branches:
      - "main"
  pull_request:

name: "CI"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  ci:
    uses: "WebProject-xyz/.github/.github/workflows/ci.yml@1026090960a69e7f3424a49611cbbfac54e3e358" # main
    secrets: inherit
    with:
      php-version: "8.5"
      test-matrix: |
        [
          {"php-version": "8.5", "dependencies": "locked", "with_coverage": true}
        ]
